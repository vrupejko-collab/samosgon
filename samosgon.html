<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Самосгон</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
 body{font-family:system-ui;background:#1b1f24;color:#e8e6e1;margin:0;padding:12px}
 h1{font-size:20px;margin:4px 0}
 .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
 .stat{background:#262c33;border-radius:8px;padding:4px 10px}
 .mini{display:inline-block;width:60px;height:6px;border-radius:3px;background:#111;vertical-align:middle;margin-left:6px}
 .mini i{display:block;height:6px;border-radius:3px}
 button{background:#3a7d44;color:#fff;border:0;border-radius:8px;padding:8px 12px;margin:2px;cursor:pointer}
 button:disabled{opacity:.4}
 .tab{background:#262c33}.tab.on{background:#3a7d44}
 .card{background:#262c33;border-radius:10px;padding:10px;margin:6px 0}
 .locked{opacity:.5}
 .pbar{height:10px;background:#111;border-radius:5px;overflow:hidden;margin:5px 0}
 .pbar i{display:block;height:10px;border-radius:5px}
 .gb{background:linear-gradient(90deg,#5da95d,#c9b458)}
 .gw{background:linear-gradient(90deg,#7e57c2,#5c6bc0)}
 .bad{color:#e57373}.ok{color:#81c784}.warn{color:#ffd54f}
 .badge{display:inline-block;padding:2px 10px;border-radius:10px;font-weight:bold}
 .needle{position:absolute;top:0;width:4px;height:30px;background:#fff;box-shadow:0 0 8px #fff}
 .muted{color:#8a9199}
 .wtext{font-size:14px;line-height:1.5;margin-top:6px}
 #log{font-size:12px;max-height:150px;overflow:auto;background:#111;color:#9c9;padding:8px;border-radius:8px}
 table{border-collapse:collapse}td{padding:4px 10px;border-bottom:1px solid #333}
 input{background:#111;color:#eee;border:1px solid #444;border-radius:6px;padding:3px 6px}
</style>
</head>
<body>
<h1>🥃 Самосгон</h1>
<div class="bar">
 <span class="stat">💰 <b id="s-money"></b></span>
 <span class="stat">⭐ <b id="s-rep"></b></span>
 <span class="stat">📅 День <b id="s-day"></b></span>
 <span class="stat">😴 <b id="s-fat"></b><span class="mini"><i id="m-fat"></i></span></span>
 <span class="stat">🔥 <b id="s-heat"></b><span class="mini"><i id="m-heat"></i></span></span>
</div>
<div class="bar">
 <button id="b-pause" onclick="pauseGame()">⏸ Пауза</button>
 <button onclick="restart()">Заново</button>
</div>
<div id="tabs" class="bar"></div>
<div id="view"></div>
<pre id="log"></pre>
<script src="data/materials.js"></script>
<script src="data/tools.js"></script>
<script src="data/recipes.js"></script>
<script src="data/upgrades.js"></script>
<script src="data/skills.js"></script>
<script>
"use strict";
const DEF={money:500,rep:0,fat:0,heat:0,day:1,sugar:0,beet:0,potato:0,mash:0,mashQ:50,spirit:0,quality:50,
 bottles:6,yeast:0,fert:0,plots:[],auto:false,floor2:false,app:1,mark:false,license:false,
 tools:{},loans:[],brewing:null,paused:false,lastMashRec:"sugar",
 recipesKnown:["sugar"],distilled:{},brewCount:0,distCount:0,harvestCount:0,
 wiki:[],skillPts:0,skills:[],milestones:[],
 timers:{daySec:3,ferment:3,event:14,loan:4,growBeet:5,growPotato:7,dieBeet:3,diePotato:4}};
const KEY="samosgon_v3";
const TABS=["Огород","Чан","Перегонка","Продажа","Магазин","Развитие","Wiki","Прогресс","Dev"];
const SHOPS=[
 {name:"Кореш",icon:"🤝",base:500,rep:0,heat:0},
 {name:"Рынок",icon:"🏪",base:700,rep:0,heat:8},
 {name:"Бар «Кабачок»",icon:"🍻",base:950,rep:40,heat:3}];
const UNLOCK=[[0,"Свёкла, брага, перегонка, кореш и рынок"],[10,"Картофель, займы соседей"],
 [20,"Автополив, доп. грядки, аппарат II"],[30,"Второй этаж — большой склад"],
 [40,"Бар «Кабачок»"],[60,"Аппарат III, знак качества"]];
const MILES=[10,20,30,40,60];
const DEV=[["money","Деньги"],["rep","Репутация"],["fat","Усталость"],["heat","Жара"],["day","День"],
 ["sugar","Сахар, кг"],["beet","Свёкла, кг"],["potato","Картофель, кг"],["mash","Брага, л"],
 ["mashQ","Кач. браги"],["spirit","Самогон, л"],["quality","Кач. спирта"],["bottles","Бутылок"],
 ["yeast","Дрожжи"],["fert","Удобрения"],["skillPts","Очки навыка"]];
const DEVT=[["daySec","Длина дня, сек"],["ferment","Брожение, дней"],["event","Шанс события, %"],
 ["loan","Возврат займа, дней"],["growBeet","Рост свёклы"],["growPotato","Рост картофеля"],
 ["dieBeet","Свёкла без полива"],["diePotato","Картофель без полива"]];

let S=null,timer=null,distill=null,distLoop=null,cur="intro",headerDirty=true;

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 S=JSON.parse(JSON.stringify(DEF));
 if(d){Object.assign(S,d);
  S.timers=Object.assign(JSON.parse(JSON.stringify(DEF.timers)),d.timers||{});}}
function log(t){const el=document.getElementById("log");
 el.textContent="День "+S.day+": "+t+"\n"+el.textContent}
function has(k){return S.skills.indexOf(k)>=0}
function vatCap(){return 50+(S.tools.vat||0)*50}
function plotsN(){return 3+(S.rep>=20?6:0)}
function sugarCap(){return S.floor2?200:50}
function setTimer(){clearInterval(timer);timer=setInterval(tick,Math.max(500,S.timers.daySec*1000))}
function pauseGame(){S.paused=!S.paused;
 document.getElementById("b-pause").textContent=S.paused?"▶ Пуск":"⏸ Пауза"}
function restart(){if(!confirm("Начать заново? Прогресс сбросится."))return;
 localStorage.removeItem(KEY);S=JSON.parse(JSON.stringify(DEF));cur="intro";save();render()}
function show(t){cur=t;render()}
function accept(){cur="Огород";save();render()}

// ---------- визуальные помощники ----------
function pic(src,icon,size){return '<img src="'+src+'" alt="'+icon+'" width="'+size+
 '" height="'+size+'" style="vertical-align:middle;border-radius:6px" onerror="this.outerHTML=\''+icon+'\'">'}
function pbar(cls,val,bg){return '<div class="pbar"><i class="'+cls+'" style="'+
 (bg?"background:"+bg+";":"")+"width:"+Math.max(0,Math.min(100,val))+'%"></i></div>'}
function heatColor(v){return v>=70?"#e57373":v>=40?"#ffd54f":"#81c784"}
function fatColor(v){return v>=80?"#e57373":v>=50?"#ffd54f":"#81c784"}
function qBadge(q){const c=q>=70?"#2e7d32":q>=45?"#f9a825":"#c62828";
 return '<span class="badge" style="background:'+c+'">качество '+q+'</span>'}
function nextUnlock(){for(const u of UNLOCK)if(S.rep<u[0])return u;return[100,"Всё открыто!"]}
function headerFlash(){headerDirty=true}
function zone(){return has("master1")?[35,65]:[40,60]}
function shopRep(sh){return sh.rep===40&&has("trade2")?20:sh.rep}

// ---------- интро ----------
function introHTML(){return '<div class="card" style="font-family:Georgia,serif">'+
 "<h3>Письмо от нотариуса</h3>"+
 "<p>Согласно завещанию Анны Петровны вам переходит дом в деревне Тыковка, сарай и аппарат «Молния-2».</p>"+
 "<p><i>«Внучек, сахар лежит в чулане. Не жадничай и гони с душой. Бабушка»</i></p>"+
 '<button onclick="accept()">Принять наследство</button></div>'}

// ---------- огород ----------
function addPlot(){if(S.rep<20||S.plots.length>=plotsN()||S.money<50)return;
 S.money-=50;S.plots.push({crop:null,growth:0,dry:0,fert:false,ready:false,watered:false});
 headerFlash();save();render()}
function plant(i,c){const p=S.plots[i];if(p.crop)return;
 const cost=MATERIALS[c==="beet"?"seeds_beet":"seeds_potato"].price;
 if(S.money<cost)return;
 S.money-=cost;p.crop=c;p.growth=0;p.dry=0;p.ready=false;p.watered=false;
 if(S.fert>0){S.fert--;p.fert=true}
 headerFlash();save();render()}
function water(i){S.plots[i].watered=true;save();render()}
function waterAll(){if(!S.tools.bucket)return;S.plots.forEach(p=>{if(p.crop&&!p.ready)p.watered=true});save();render()}
function harvest(i){const p=S.plots[i];if(!p.ready)return;const c=CROPS[p.crop];
 const y=c.yield+(p.fert?5:0)+(has("garden1")?2:0)+(has("garden2")?3:0);
 S[p.crop]=(S[p.crop]||0)+y;S.harvestCount++;
 log("Собрал "+y+" кг: "+c.name.toLowerCase());
 p.crop=null;p.ready=false;p.fert=false;
 headerFlash();checkWiki();checkMiles();save();render()}

function viewOgorod(){let h='<div class="card"><b>Грядки: '+S.plots.length+'/'+plotsN()+'</b>'+
  (S.auto?" · 💧 автополив включён":"")+"</div>";
 if(S.plots.length<plotsN())
  h+='<button onclick="addPlot()" '+(S.rep>=20&&S.money>=50?"":"disabled")+'>+ Грядка (50 ₽)</button>';
 if(S.plots.length<plotsN()&&S.rep<20)h+='<div class="locked">🔒 Ещё грядки — с репутации 20</div>';
 S.plots.forEach((p,i)=>{h+='<div class="card">';
  if(!p.crop){h+="Пустая грядка. "+
   "<button onclick=\"plant("+i+",'beet')\">"+pic(MATERIALS.seeds_beet.img,"🌱",16)+" Свёкла ("+MATERIALS.seeds_beet.price+" ₽)</button>"+
   (S.rep>=10?"<button onclick=\"plant("+i+",'potato')\">"+pic(MATERIALS.seeds_potato.img,"🥔",16)+" Картофель ("+MATERIALS.seeds_potato.price+" ₽)</button>"
    :'<span class="locked">🔒 Картофель — реп. 10</span>');
  }else{const c=CROPS[p.crop],need=S.timers[p.crop==="beet"?"growBeet":"growPotato"];
   h+=pic(c.img,c.icon,24)+" <b>"+c.name+"</b>"+(p.fert?" 💩":"")+(p.ready?' <span class="ok">— ГОТОВА!</span>':"")+"<br>"+
    pbar("gb",p.growth/need*100)+
    '<span class="muted">'+p.growth+"/"+need+" дн. · "+
    (p.dry>0?'<span class="bad">🥵 без полива '+p.dry+" дн.</span>":"💧 полито")+"</span><br>"+
    (p.ready?'<button onclick="harvest('+i+')">Собрать урожай</button>'
            :'<button onclick="water('+i+')">Полить</button>');}
  h+="</div>"});
 h+='<button onclick="waterAll()" '+(S.tools.bucket?"":"disabled")+'>🪣 Полить всё'+
  (S.tools.bucket?"":" (нужно ведро)")+"</button>";
 return h}

// ---------- чан и брожение ----------
function brew(k){const r=RECIPES[k];
 if(S.recipesKnown.indexOf(k)<0){log("🔒 Рецепт не изучен — купи его в магазине");return}
 if(r.rep&&S.rep<r.rep){log("🔒 Рецепт откроется с "+r.rep+" репутации");return}
 for(const m in r.need)if((S[m]||0)<r.need[m])return;
 if(S.mash+r.out>vatCap()){log("Чан переполнен — нужна ёмкость побольше");return}
 for(const m in r.need)S[m]-=r.need[m];
 let left=S.timers.ferment;
 if(S.yeast>0){left=Math.max(1,left-1);S.yeast--}
 S.brewing={rec:k,left:left,q:r.quality};
 S.brewCount++;
 log("Поставил брагу: "+r.name);
 headerFlash();checkWiki();checkMiles();save();render()}
function sleep(){if(S.money<10){log("Нет денег даже на сон");return}
 S.money-=10;S.fat=0;log("Выспался!");headerFlash();save();render()}

function viewChan(){let h='<div class="card">'+pic("img/tools/vat.svg","🛢",20)+' Чан: <b>'+S.mash+'</b> / '+vatCap()+" л</div>"+
  pbar("gw",S.mash/vatCap()*100);
 if(S.brewing){const r=RECIPES[S.brewing.rec];
  h+='<div class="card">🫧 <b>'+r.name+"</b> бродит — осталось "+S.brewing.left+" дн.</div>"+
   pbar("gb",(1-S.brewing.left/S.timers.ferment)*100)}
 else h+='<div class="card"><span class="muted">Чан пуст — поставь брагу</span></div>';
 for(const k in RECIPES){const r=RECIPES[k];
  if(S.recipesKnown.indexOf(k)<0){
   h+='<div class="card locked">🔒 <b>'+r.name+"</b> — рецепт ещё не изучен. Купи его в магазине.</div>";continue}
  const can=Object.keys(r.need).every(m=>(S[m]||0)>=r.need[m]);
  h+='<div class="card">'+pic(r.img,"🫙",20)+" <b>"+r.name+"</b> — "+
   Object.keys(r.need).map(m=>r.need[m]+" "+UNITS[m]).join(", ")+
   " → "+r.out+" л, базовое качество "+r.quality+(r.rep&&S.rep<r.rep?' 🔒 реп. '+r.rep:"")+"<br>"+
   '<button onclick="brew(\''+k+'\')" '+((can&&!S.brewing)?"":"disabled")+">Поставить брагу</button></div>"}
 h+='<button onclick="sleep()">😴 Спать (10 ₽)</button>';
 return h}

// ---------- перегонка ----------
function startDistill(){if(S.mash<1)return;
 distill={pos:0,dir:1,hits:0,misses:0};
 distLoop=setInterval(moveNeedle,50);render()}
function cancelDistill(){clearInterval(distLoop);distill=null;render()}
function moveNeedle(){if(!distill)return;
 distill.pos+=distill.dir*6;
 if(distill.pos>=100){distill.pos=100;distill.dir=-1}
 if(distill.pos<=0){distill.pos=0;distill.dir=1}
 const n=document.getElementById("needle");
 if(n)n.style.left=distill.pos+"%"}
function stopNeedle(){if(!distill)return;const z=zone();
 if(distill.pos>=z[0]&&distill.pos<=z[1]){distill.hits++;log("🎯 Игла в цели!");
  if(distill.hits>=3)finishDistill(true)}
 else{distill.misses++;log("Мимо...");if(distill.misses>=3)finishDistill(false)}}
function finishDistill(ok){clearInterval(distLoop);distill=null;
 let y=S.mash*0.5*(S.tools.coil?1.15:1)*(S.app===3?1.2:S.app===2?1.1:1)*(has("master3")?1.1:1);
 y=Math.floor(y);
 let q=S.mashQ+(S.tools.meter?3:0)+(S.mark?5:0)+(has("master2")?5:0)+
  (has("master4")?2*S.wiki.length:0)+(ok?15:-20);
 if(S.fat>80)q-=10;
 S.quality=Math.max(10,Math.min(100,q));
 S.spirit+=y;S.mash=0;
 S.distCount++;S.distilled[S.lastMashRec||"sugar"]=true;
 log(ok?"Отсечка пройдена! Получил "+y+" л, качество "+S.quality
       :"Перегар! Сивуха: качество "+S.quality);
 headerFlash();checkWiki();checkMiles();save();render()}
function distHTML(){
 const z=zone(),ap=pic("img/upgrades/app"+S.app+".svg","⚗",64);
 if(!distill)return '<div class="card">'+ap+" Аппарат «Молния-"+S.app+"» · Брага: <b>"+S.mash+"</b> л. "+
  qBadge(S.mashQ)+
  '<br><button onclick="startDistill()" '+(S.mash>=1?"":"disabled")+">Начать перегонку</button></div>";
 return '<div class="card">'+ap+'<b>🎯 Отсечка голов</b> — жми «Стоп», когда игла в зелёной зоне!<br>'+
  '<div style="height:30px;border-radius:6px;position:relative;margin:8px 0;'+
  'background:linear-gradient(to right,#c0392b 0 '+z[0]+'%,#27ae60 '+z[0]+'% '+z[1]+'%,#c0392b '+z[1]+'% 100%)">'+
  '<div id="needle" class="needle" style="left:'+distill.pos+'%"></div></div>'+
  "<p>Попаданий: "+distill.hits+"/3 · Промахов: "+distill.misses+"/3</p>"+
  '<button onclick="stopNeedle()">Стоп!</button> <button onclick="cancelDistill()">Отмена</button></div>'}

// ---------- продажа ----------
function price(ch){let p=ch.base*(1+(S.quality-50)/100);
 if(has("trade1"))p*=1.10;if(S.mark)p*=1.15;if(has("trade3"))p*=1.15;return Math.round(p)}
function sell(i){const sh=SHOPS[i],rep=shopRep(sh);if(S.rep<rep)return;
 const l=Math.min(S.spirit,S.bottles);
 if(l<1){log(S.bottles<1?"Нет бутылок — купи в магазине":"Нечего продавать");return}
 const money=l*price(sh);
 S.money+=money;S.spirit-=l;S.bottles-=l;S.rep+=Math.round(l/2);
 if(!S.license&&sh.name!=="Кореш")S.heat=Math.min(100,S.heat+sh.heat*l);
 log("Продал "+l+" л в «"+sh.name+"» за "+money+" ₽");
 if(S.heat>=100){S.heat=0;const lost=Math.ceil(S.spirit/2);S.spirit-=lost;
  S.money=Math.max(0,S.money-1000);log("🔥 ОБЛАВА! Забрали "+lost+" л и 1000 ₽")}
 headerFlash();checkMiles();save();render()}
function viewSell(){let h='<div class="card">🍾 Самогон: <b>'+S.spirit+"</b> л · "+
  qBadge(S.quality)+" · Бутылок: "+S.bottles+"</div>";
 h+='<div class="card">🔥 Жара: '+S.heat+"%</div>"+pbar("",S.heat,heatColor(S.heat));
 if(S.heat>=70)h+='<div class="card bad">🔥 Жара '+S.heat+"% — на рынке опасно!</div>";
 SHOPS.forEach((sh,i)=>{const rep=shopRep(sh),lock=S.rep<rep;
  h+='<div class="card"><b>'+sh.icon+" "+sh.name+"</b> — "+price(sh)+" ₽/л"+
   (lock?" 🔒 реп. "+rep:"")+"<br>"+
   '<button onclick="sell('+i+')" '+((!lock&&S.spirit>=1)?"":"disabled")+">Продать всё</button></div>"});
 return h}

// ---------- магазин ----------
function buyM(k){const m=MATERIALS[k];if(S.money<m.price)return;
 if(k==="sugar"){if(S.sugar+10>sugarCap()){log("Склад переполнен");return}S.sugar+=10}
 else if(k==="yeast")S.yeast++;
 else if(k==="fertilizer")S.fert++;
 else if(k==="bottles")S.bottles++;
 else return;
 S.money-=m.price;headerFlash();save();render()}
function buyTool(k){const t=TOOLS[k];const n=S.tools[k]||0;
 if(k==="vat"&&n>=(t.max||99))return;
 if(S.money<t.price)return;
 S.money-=t.price;S.tools[k]=n+1;
 if(k==="crate")S.bottles+=5;
 log("Куплено: "+t.icon+" "+t.name);
 headerFlash();checkWiki();checkMiles();save();render()}
function buyUp(k){const u=UPGRADES[k];
 if(S.rep<u.rep){log("🔒 Нужно "+u.rep+" репутации");return}
 if(S.money<u.price){log("Не хватает денег");return}
 if(k==="app2"){if(S.app>=2)return;S.app=2}
 else if(k==="app3"){if(S.app<2)return;S.app=3}
 else{if(S[k])return;S[k]=true}
 S.money-=u.price;log("Куплено: "+u.icon+" "+u.name);
 headerFlash();checkWiki();checkMiles();save();render()}
function buyRecipe(k){const r=RECIPES[k];
 if(S.recipesKnown.indexOf(k)>=0)return;
 if(r.rep&&S.rep<r.rep){log("🔒 Нужно "+r.rep+" репутации");return}
 if(S.money<r.price)return;
 S.money-=r.price;S.recipesKnown.push(k);
 log("📜 Изучен рецепт: "+r.name);headerFlash();save();render()}
function viewShop(){let h='<div class="card"><b>Материалы</b></div>';
 ["sugar","yeast","fertilizer","bottles"].forEach(k=>{const m=MATERIALS[k];
  h+='<div class="card">'+pic(m.img,m.icon,20)+" <b>"+m.name+"</b> — "+m.price+" ₽. "+
   '<span class="muted">'+m.desc+"</span><br>"+
   '<button onclick="buyM(\''+k+'\')">Купить</button></div>'});
 h+='<div class="card"><b>Инструменты</b></div>';
 for(const k in TOOLS){const t=TOOLS[k],n=S.tools[k]||0,dis=(k==="vat"&&n>=t.max);
  h+='<div class="card">'+pic(t.img,t.icon,20)+" <b>"+t.name+"</b>"+(n?" ×"+n:"")+" — "+t.price+" ₽. "+
   '<span class="muted">'+t.desc+"</span><br>"+
   '<button onclick="buyTool(\''+k+'\')" '+(dis?"disabled":"")+">Купить</button></div>"}
 h+='<div class="card"><b>Улучшения</b></div>';
 const map={autopoliv:"auto",floor2:"floor2",mark:"mark",license:"license"};
 for(const k in UPGRADES){const u=UPGRADES[k];
  const owned=(k==="app2"&&S.app>=2)||(k==="app3"&&S.app>=3)||(map[k]&&S[map[k]]);
  const lock=S.rep<u.rep;
  h+='<div class="card">'+pic(u.img,u.icon,20)+" <b>"+u.name+"</b> — "+u.price+" ₽"+
   (u.rep?" (реп. "+u.rep+")":"")+(owned?' <span class="ok">✔</span>':"")+"<br>"+
   '<span class="muted">'+u.desc+"</span><br>"+
   '<button onclick="buyUp(\''+k+'\')" '+((owned||lock)?"disabled":"")+">"+
   (owned?"Куплено":"Купить")+"</button></div>"}
 h+='<div class="card"><b>Рецепты</b></div>';
 for(const k in RECIPES){const r=RECIPES[k];
  if(S.recipesKnown.indexOf(k)>=0)continue;
  h+='<div class="card">'+pic(r.img,"📜",20)+" <b>"+r.name+"</b> — "+r.price+" ₽"+
   (r.rep?" (реп. "+r.rep+")":"")+"<br>"+
   '<span class="muted">'+r.wiki+"</span><br>"+
   '<button onclick="buyRecipe(\''+k+'\')" '+
   ((S.money>=r.price&&(!r.rep||S.rep>=r.rep))?"":"disabled")+">Купить рецепт</button></div>"}
 return h}

// ---------- развитие ----------
function learnSkill(k){const s=SKILLS[k];
 if(has(k))return;
 if(s.req&&!has(s.req))return;
 if(S.skillPts<1){log("Нет очков навыка — открывай Wiki и расти в репутации");return}
 S.skills.push(k);S.skillPts--;
 log("🌰 Изучено: "+s.name);headerFlash();save();render()}
function viewSkills(){
 const branches={};
 for(const k in SKILLS){const s=SKILLS[k];(branches[s.branch]=branches[s.branch]||[]).push(k)}
 let h='<div class="card">🌰 Очки навыка: <b>'+S.skillPts+'</b> · изучено: '+S.skills.length+"/"+Object.keys(SKILLS).length+
  ' · очки дают Wiki и вехи репутации</div>';
 for(const b in branches){
  h+='<div class="card"><b>'+b+"</b></div>";
  branches[b].forEach(k=>{const s=SKILLS[k],own=has(k),lock=s.req&&!has(s.req);
   h+='<div class="card">'+s.icon+" <b>"+s.name+"</b>"+(own?' <span class="ok">✔</span>':"")+
    (lock?' <span class="muted">нужно: '+SKILLS[s.req].name+"</span>":"")+"<br>"+
    '<span class="muted">'+s.desc+"</span><br>"+
    (own?"":'<button onclick="learnSkill(\''+k+'\')" '+((!lock&&S.skillPts>=1)?"":"disabled")+">Изучить (1 очко)</button>")+
    "</div>"})}
 return h}

// ---------- вики ----------
function unlockMet(k){const u=WIKI[k].unlock;
 switch(u.type){
  case "brew":return S.brewCount>0;
  case "distill":return S.distCount>0;
  case "harvest":return S.harvestCount>0;
  case "tool":return !!S.tools[u.id];
  case "upgrade":return u.id==="app2"?S.app>=2:S.app>=3;
  case "recipe":return !!S.distilled[u.id];
  case "rep":return S.rep>=u.value;
  default:return false}}
function checkWiki(){WIKI_ORDER.forEach(k=>{
 if(S.wiki.indexOf(k)<0&&unlockMet(k)){
  S.wiki.push(k);S.skillPts++;
  log("📖 Открыта страница Wiki: «"+WIKI[k].title+"» — +1 очко навыка")}})}
function viewWiki(){
 let h='<div class="card">📖 Вики винокура: открыто '+S.wiki.length+"/"+WIKI_ORDER.length+
  ' · каждая страница даёт очко навыка</div>';
 WIKI_ORDER.forEach(k=>{const w=WIKI[k];
  if(S.wiki.indexOf(k)>=0){
   h+='<div class="card"><b>'+w.icon+" "+w.title+'</b><br>'+pic(w.img,w.icon,56)+
    '<div class="wtext">'+w.text+"</div></div>"}
  else h+='<div class="card locked">🔒 ??? <span class="muted">Подсказка: '+w.hint+"</span></div>"});
 return h}

// ---------- прогресс и dev ----------
function viewProgress(){const nx=nextUnlock();
 return '<div class="card">⭐ Репутация: <b>'+S.rep+"</b> · до «"+nx[1]+"» осталось "+
  Math.max(0,nx[0]-S.rep)+"</div>"+
  pbar("gb",nx[0]>=100?100:S.rep/Math.max(1,nx[0])*100)+
  "<table>"+UNLOCK.map(u=>"<tr><td>"+(S.rep>=u[0]?"⭐":"🔒")+" "+u[0]+"</td><td>"+u[1]+"</td></tr>").join("")+"</table>"}
function devHTML(){let h='<div class="card"><b>Ресурсы и состояние</b><br>'+
 DEV.map(d=>d[1]+': <input id="dv_'+d[0]+'" value="'+S[d[0]]+'" style="width:70px">').join("<br>")+"</div>";
 h+='<div class="card"><b>Флаги</b><br>'+
  ["auto","floor2","mark","license"].map(k=>
   '<label><input type="checkbox" id="dv_'+k+'" '+(S[k]?"checked":"")+"> "+k+"</label>").join("<br>")+"</div>";
 h+='<div class="card"><b>Таймеры и события</b><br>'+
 DEVT.map(d=>d[1]+': <input id="dv_'+d[0]+'" value="'+S.timers[d[0]]+'" style="width:60px">').join("<br>")+"</div>";
 h+='<button onclick="devApply()">Применить</button> <button onclick="devDay()">+1 день</button> '+
  '<button onclick="devOpenWiki()">Открыть всю Wiki</button> '+
  '<button onclick="devSkill()">+1 очко навыка</button> '+
  '<button onclick="restart()">Сброс игры</button>';
 return h}
function devApply(){
 DEV.forEach(d=>{const v=parseFloat(document.getElementById("dv_"+d[0]).value);
  if(!isNaN(v))S[d[0]]=v});
 ["auto","floor2","mark","license"].forEach(k=>{S[k]=document.getElementById("dv_"+k).checked});
 DEVT.forEach(d=>{const v=parseFloat(document.getElementById("dv_"+d[0]).value);
  if(!isNaN(v))S.timers[d[0]]=v});
 setTimer();headerFlash();checkMiles();save();render()}
function devOpenWiki(){let n=0;
 WIKI_ORDER.forEach(k=>{if(S.wiki.indexOf(k)<0){S.wiki.push(k);n++}});
 if(n){S.skillPts+=n;log("Dev: открыл все страницы Wiki (+"+n+" очков)")}
 headerFlash();save();render()}
function devSkill(){S.skillPts++;log("Dev: +1 очко навыка");headerFlash();save();render()}
function devDay(){tick()}

// ---------- день и события ----------
function event(){const r=Math.random();
 if(r<0.25){S.money+=300;log("Тётя Клава прислала 300 ₽ на обустройство")}
 else if(r<0.5&&S.rep>=10){S.loans.push({who:"Сосед",amount:300,ret:S.timers.loan});
  log("Сосед занял 300 ₽ под честное слово")}
 else if(r<0.5){S.money+=150;log("Продал бабушкино варенье за 150 ₽")}
 else if(r<0.7){S.heat=Math.min(100,S.heat+10);log("В деревне появился участковый — жара +10")}
 else if(r<0.85){S.fat=Math.min(100,S.fat+15);log("Косили сено у соседа — усталость +15")}
 else{S.money=Math.max(0,S.money-200);log("Сгорел сарай (не весь) — ремонт 200 ₽")}
 headerFlash()}
function tick(){if(S.paused||cur==="intro")return;
 S.day++;
 S.plots.forEach(p=>{if(!p.crop)return;
  const gk=p.crop==="beet"?"growBeet":"growPotato",dk=p.crop==="beet"?"dieBeet":"diePotato";
  if(S.auto||p.watered){p.growth++;p.dry=0}else p.dry++;
  p.watered=false;
  if(p.growth>=S.timers[gk]&&!p.ready){p.ready=true;log("Урожай «"+CROPS[p.crop].name+"» созрел")}
  else if(p.growth<S.timers[gk]&&p.dry>=S.timers[dk]+(has("garden2")?1:0)){
   log("Грядка с "+CROPS[p.crop].name.toLowerCase()+" засохла");
   p.crop=null;p.growth=0;p.dry=0;p.fert=false}});
 if(S.brewing){S.brewing.left--;
  if(S.brewing.left<=0){S.lastMashRec=S.brewing.rec;
   S.mash+=RECIPES[S.brewing.rec].out;S.mashQ=S.brewing.q;
   S.brewing=null;log("🫧 Брага созрела — можно гнать")}}
 S.money-=20;
 if(S.money<0){S.money=0;log("Денег нет — живём в долг")}
 S.fat=Math.min(100,S.fat+(has("garden3")?5:8));S.heat=Math.max(0,S.heat-3);
 if(S.fat>=100){S.fat=60;log("Свалился с ног — проспал день")}
 S.loans=S.loans.filter(l=>{l.ret--;
  if(l.ret<=0){const back=Math.round(l.amount*1.5);S.money+=back;S.rep+=5;
   log(l.who+" вернул долг: +"+back+" ₽");return false}return true});
 if(Math.random()*100<S.timers.event)event();
 checkWiki();checkMiles();headerFlash();save();render()}

// ---------- рендер ----------
function render(){
 if(headerDirty){
  document.getElementById("s-money").textContent=S.money+" ₽";
  document.getElementById("s-rep").textContent=S.rep;
  document.getElementById("s-day").textContent=S.day;
  document.getElementById("s-fat").textContent=S.fat+"%";
  document.getElementById("s-heat").textContent=S.heat+"%";
  const mf=document.getElementById("m-fat"),mh=document.getElementById("m-heat");
  mf.style.width=S.fat+"%";mf.style.background=fatColor(S.fat);
  mh.style.width=S.heat+"%";mh.style.background=heatColor(S.heat);
  headerDirty=false}
 document.getElementById("tabs").innerHTML=TABS.map(t=>
  '<button class="tab'+(cur===t?" on":"")+'" onclick="show(\''+t+'\')">'+t+"</button>").join("");
 const v=document.getElementById("view");
 if(cur==="intro")v.innerHTML=introHTML();
 else if(cur==="Огород")v.innerHTML=viewOgorod();
 else if(cur==="Чан")v.innerHTML=viewChan();
 else if(cur==="Перегонка")v.innerHTML=distHTML();
 else if(cur==="Продажа")v.innerHTML=viewSell();
 else if(cur==="Магазин")v.innerHTML=viewShop();
 else if(cur==="Развитие")v.innerHTML=viewSkills();
 else if(cur==="Wiki")v.innerHTML=viewWiki();
 else if(cur==="Прогресс")v.innerHTML=viewProgress();
 else if(cur==="Dev")v.innerHTML=devHTML()}

// ---------- старт ----------
load();
checkWiki();checkMiles();
if(localStorage.getItem(KEY))cur="Огород";
headerDirty=true;render();setTimer();
document.addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();pauseGame()}});
</script>
</body>
</html>
